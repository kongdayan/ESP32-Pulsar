name: PR Check

on:
  pull_request:
    branches: ["main"]

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: C/C++ static analysis with cppcheck                          #
  # ui/ is excluded — auto-generated by SquareLine Studio               #
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --error-exitcode=1 \
            --quiet \
            hal/ screens/ core/ common/ main.cpp

  # ------------------------------------------------------------------ #
  # Job 1b: Host-side unit tests + coverage gate (no hardware needed)   #
  # ------------------------------------------------------------------ #
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang / llvm profiling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install firmware dependencies (provides LVGL sources)
        run: pio run

      - name: Run unit tests
        run: make -C tests test

      - name: Enforce coverage threshold (lines >= 90%)
        run: make -C tests check-coverage MIN_LINE_COVERAGE=90

      - name: Publish coverage summary
        if: always()
        run: |
          mkdir -p coverage-out
          make -C tests coverage-html >/dev/null 2>&1 || true
          python3 tests/tools/coverage_summary.py tests/build/coverage.json 90 \
            --markdown coverage-out/coverage.md || true
          cat coverage-out/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-coverage
          path: |
            tests/build/coverage-html
            tests/build/coverage.json
          retention-days: 14

  # ------------------------------------------------------------------ #
  # Job 2: Secret / credential detection with Gitleaks                  #
  # Scans all commits in the PR diff                                     #
  # ------------------------------------------------------------------ #
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ #
  # Job 3: Build firmware, report flash / RAM usage, and post PR comment#
  # Re-runs update the existing comment instead of creating a new one   #
  # ------------------------------------------------------------------ #
  firmware-size:
    name: Firmware Size Report
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run 2>&1 | tee build.log

      - name: Prepare size report
        run: |
          SIZE_LINES=$(grep -E "(RAM:|Flash:)" build.log || echo "Size info not available")

          BIN_SIZE="N/A"
          if [ -f .pio/build/esp32s3/firmware.bin ]; then
            BIN_BYTES=$(wc -c < .pio/build/esp32s3/firmware.bin)
            BIN_KB=$(awk "BEGIN {printf \"%.1f\", $BIN_BYTES/1024}")
            BIN_SIZE="${BIN_KB} KB (${BIN_BYTES} bytes)"
          fi

          {
            printf '<!-- firmware-size-report -->\n'
            printf '## Firmware Size Report\n\n'
            printf '**Memory Usage**\n'
            printf '```\n'
            printf '%s\n' "$SIZE_LINES"
            printf '```\n\n'
            printf '| File | Size |\n'
            printf '|------|------|\n'
            printf '| `firmware.bin` | %s |\n' "$BIN_SIZE"
            printf '\n> Artifact available for 7 days · [View full run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > size_comment.md

      - name: Update step summary
        run: cat size_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('size_comment.md', 'utf8');
            const marker = '<!-- firmware-size-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new comment');
            }

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            .pio/build/esp32s3/firmware.bin
            .pio/build/esp32s3/firmware.elf
          retention-days: 7
