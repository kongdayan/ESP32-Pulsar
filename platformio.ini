[platformio]
src_dir = .

[env:esp32s3]
; pioarduino provides Arduino ESP32 3.1.1 (IDF 5.3) required by ESP32_Display_Panel v1.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino

; --- Serial ---
monitor_speed = 115200
upload_speed  = 921600

; --- Build flags ---
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/hal
    -I${PROJECT_DIR}/screens
    -I${PROJECT_DIR}/ui
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/common
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Only compile the actual source files ---
build_src_filter =
    -<*>
    +<main.cpp>
    +<core/*.c>
    +<common/*.c>
    +<hal/display.cpp>
    +<hal/sd_card.cpp>
    +<ui/ui.c>
    +<screens/screen_dashboard.c>
    +<screens/screen_info.c>
    +<screens/screen_image.c>
    +<screens/screen_video.c>
    +<screens/screen_about.c>
    +<screens/screen_agent.c>
    +<screens/screen_3dmodel.c>
    +<screens/screen_codex_usage.c>
    +<ui/ui_helpers.c>
    +<ui/ui_img_1539399133.c>

; --- Libraries ---
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    lvgl/lvgl@8.3.11
